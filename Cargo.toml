[package]
name = "mrly-num"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The integers: primes, divisors, series, sieves, lattices and spectra."
readme = "README.md"
include = ["src/**", "bridge.toml", "manifest.json", "README.md", "LICENSE"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
mrly-core.workspace = true

[dev-dependencies]
serde_json.workspace = true

[workspace]
members = ["js", "py", "cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrlyprod/num"
homepage = "https://mrly.net"
rust-version = "1.96"
keywords = ["mathematics", "fractal", "cellular-automata", "generative"]
categories = ["mathematics", "science", "multimedia::images"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

[workspace.dependencies]
mrly-num = { path = ".", version = "0.2.0" }
mrly-core = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.125"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
